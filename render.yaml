# Render Blueprint - https://render.com/docs/blueprint-spec
# Connect this repository in the Render dashboard and it will create the API
# service with these settings pre-filled.
services:
  - type: web
    name: expense-tracker-api
    runtime: node
    plan: free
    rootDir: Expense Tracker/backend
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render's Node installer honours this, so the build matches local dev.
      - key: NODE_VERSION
        value: 22.19.0
      # Paste your Atlas string when the blueprint creates the service - it is
      # never stored in this file or in git. Drop the placeholder's angle
      # brackets; they are not part of the value and leaving them in fails as
      # "bad auth". Shape to paste:
      # mongodb+srv://abelink:YOURPASSWORD@expensetracker.luu9hse.mongodb.net/?appName=expenseTracker
      - key: MONGO_URL
        sync: false
      # generateValue makes Render create a random secret at deploy time.
      - key: JWT_SECRET
        generateValue: true
      # The Vercel frontend origins, allowed by CORS (comma-separated).
      - key: CLIENT_URL
        value: https://expense-tracker-beige-nine-24.vercel.app,https://expense-tracker-abelink2119s-projects.vercel.app
